<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع فصل 1/3 🔴🔵</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: white;
            font-family: 'Cairo', sans-serif;
            text-align: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
        }
        .header {
            background: linear-gradient(45deg, #dc2626, #2563eb);
            padding: 20px;
            border-radius: 20px;
            margin-bottom: 30px;
            box-shadow: 0 0 30px rgba(220,38,38,0.5);
        }
        .header h1 {
            font-size: 32px;
            margin-bottom: 5px;
        }
        .header p {
            color: #facc15;
            font-size: 16px;
        }
        .profile-img {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            border: 4px solid #38bdf8;
            box-shadow: 0 0 25px rgba(56,189,248,0.6);
            margin: 20px auto;
            object-fit: cover;
            display: block;
        }
        .name {
            font-size: 24px;
            font-weight: bold;
            margin: 15px 0;
            color: #facc15;
        }
        .title {
            font-size: 18px;
            color: #94a3b8;
            margin-bottom: 30px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin: 15px 0;
            background: linear-gradient(45deg, #dc2626, #2563eb);
            color: white;
            text-decoration: none;
            border-radius: 15px;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            transition: 0.3s;
        }
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(220,38,38,0.5);
        }
        .footer {
            margin-top: 40px;
            color: #64748b;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔥 فصل 1/3 🔵</h1>
            <p>مدرسة الشهيد أحمد هاشم البيدي الثانوية</p>
        </div>

        <!-- صورتك هتظهر هنا -->
        <img src="admin.jpg" alt="عبده أحمد" class="profile-img">
        
        <div class="name">عبده أحمد</div>
        <div class="title">مشرف الموقع | طالب 1/3</div>

        <a href="schedule.html" class="btn">📅 جدول الحصص</a>
        <a href="students.html" class="btn">👥 أسماء الطلاب</a>
        <a href="https://wa.me/201023098181" class="btn">📱 تواصل واتساب</a>

        <div class="footer">
            تم التصميم بواسطة عبده أحمد ❤️ 2025-2026
        </div>
    </div>
</body>
</html>
