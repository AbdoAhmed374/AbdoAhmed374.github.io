            box-shadow: 0 5px 20px rgba(0,0,0,0.4); transition: 0.3s;
        }
        
        .btn:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 10px 30px rgba(220,38,38,0.6);
        }
        
        .footer {
